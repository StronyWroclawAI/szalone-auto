<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Szalone auto – warsztat samochodowy Wrocław</title>
<meta name="description" content="Niezależny warsztat samochodowy we Wrocławiu: mechanika, klimatyzacja, diagnostyka komputerowa, opony, LPG. Specjalizacja BMW, Audi, Toyota.">
<meta name="theme-color" content="#15171C">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%2315171C'/%3E%3Cg transform='translate(8 8) scale(.75)' fill='none' stroke-linecap='round' stroke-linejoin='round' stroke-width='9'%3E%3Cpath d='M8 52H38A11 11 0 0 0 38 30H26A11 11 0 0 1 26 8H40' stroke='%23fff'/%3E%3Cpath d='M50 8H56' stroke='%23C9A35B'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100,500;100,600;100,700;108,700;112,600;112,700;112,800;125,800&family=Hanken+Grotesk:wght@400;500;600;700&display=swap">
<style>
/* Szalone auto — styl strony
   Układ: grafitowe pasy (hero, CTA, stopka) przeplatane jasnymi, stalowymi sekcjami treści;
   mosiężna linia z logo prowadzi wzrok od nagłówka do przycisku „Zadzwoń”. */
:root {
  --grafit: #15171C;
  --grafit-2: #22252C;
  --grafit-3: #2E323B;
  --mosiadz: #C9A35B;        /* akcent na ciemnym tle (kontrast 7.6:1) */
  --mosiadz-ciemny: #8A6A2E; /* akcent/tekst na jasnym tle (5.0:1) */
  --stal: #EEF0F3;
  --bialy: #FFFFFF;
  --tekst: #15171C;
  --tekst-2: #4F5560;
  --linia: #D5D9DF;
  --na-ciemnym: #E7E9EC;
  --na-ciemnym-2: #A3A9B3;
  --promo: #8A6A2E;
  --nowosc: #1F5F4A;

  --f-display: "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --f-body: "Hanken Grotesk", "Segoe UI", Roboto, Arial, sans-serif;

  --r: 6px;
  --max: 1160px;
  --gutter: clamp(16px, 4vw, 40px);
  color-scheme: light;
}

*, *::before, *::after { box-sizing: border-box; }
html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } *, *::before, *::after { transition: none !important; animation: none !important; } }
body {
  margin: 0;
  font-family: var(--f-body);
  font-size: 1.0625rem;
  line-height: 1.6;
  color: var(--tekst);
  background: var(--bialy);
}
img { max-width: 100%; display: block; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--mosiadz); outline-offset: 3px; border-radius: 2px; }

h1, h2, h3 { font-family: var(--f-display); font-stretch: 112%; line-height: 1.1; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2.1rem, 5.4vw, 3.9rem); font-weight: 800; letter-spacing: -0.01em; }
h2 { font-size: clamp(1.6rem, 3.4vw, 2.4rem); font-weight: 800; }
h3 { font-size: 1.2rem; font-weight: 700; font-stretch: 105%; }
p { margin: 0; max-width: 65ch; }

.skip { position: absolute; left: -9999px; top: 0; background: var(--mosiadz); color: var(--grafit); padding: .6rem 1rem; z-index: 100; font-weight: 700; }
.skip:focus { left: 1rem; top: 1rem; }

.wrap { max-width: var(--max); margin-inline: auto; padding-inline: var(--gutter); }
.sekcja { padding-block: clamp(56px, 8vw, 104px); }
.sekcja--stal { background: var(--stal); }
.sekcja--ciemna { background: var(--grafit); color: var(--na-ciemnym); }
.sekcja--ciemna h2, .sekcja--ciemna h3 { color: var(--bialy); }

.etykieta {
  display: inline-flex; align-items: center; gap: .6rem;
  font-family: var(--f-display); font-stretch: 112%; font-weight: 600;
  font-size: .78rem; letter-spacing: .16em; text-transform: uppercase;
  color: var(--mosiadz-ciemny);
}
.etykieta::before { content: ""; width: 28px; height: 3px; border-radius: 3px; background: currentColor; }
.sekcja--ciemna .etykieta, .hero .etykieta, .podhero .etykieta { color: var(--mosiadz); }

.naglowek-sekcji { display: grid; gap: .9rem; margin-bottom: clamp(28px, 4vw, 48px); }
.naglowek-sekcji p { color: var(--tekst-2); }
.sekcja--ciemna .naglowek-sekcji p { color: var(--na-ciemnym-2); }

/* Przyciski */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: .55rem;
  min-height: 48px; padding: .75rem 1.3rem; border-radius: var(--r);
  font-family: var(--f-display); font-stretch: 108%; font-weight: 700; font-size: 1rem;
  text-decoration: none; border: 2px solid transparent; cursor: pointer;
  transition: background-color .15s, color .15s, border-color .15s, transform .15s;
}
.btn svg { width: 20px; height: 20px; flex: none; }
.btn--glowny { background: var(--mosiadz); color: var(--grafit); }
.btn--glowny:hover { background: #D8B672; }
.btn--obrys { border-color: currentColor; color: inherit; background: transparent; }
.btn--obrys:hover { background: rgba(201,163,91,.12); }
.btn--ciemny { background: var(--grafit); color: var(--bialy); }
.btn--ciemny:hover { background: var(--grafit-3); }
.btn:active { transform: translateY(1px); }

/* Nagłówek */
.topbar { background: var(--grafit); color: var(--na-ciemnym-2); font-size: .875rem; }
.topbar .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .4rem 1.5rem; padding-block: .45rem; }
.topbar a { color: var(--na-ciemnym); text-decoration: none; }
.topbar a:hover { color: var(--mosiadz); }
.status { display: inline-flex; align-items: center; gap: .5rem; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--na-ciemnym-2); }
.status[data-otwarte="tak"] i { background: #5FBF8F; box-shadow: 0 0 0 3px rgba(95,191,143,.2); }

.header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 50; background: rgba(21,23,28,.97); color: var(--bialy); border-bottom: 1px solid var(--grafit-3); }
.header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 1rem; min-height: 72px; }
.logo { display: inline-flex; text-decoration: none; }
.logo svg { height: 44px; width: auto; }
.nav ul { list-style: none; margin: 0; padding: 0; display: flex; gap: .25rem; }
.nav a { display: block; padding: .6rem .8rem; text-decoration: none; font-weight: 600; color: var(--na-ciemnym); border-radius: var(--r); }
.nav a:hover { color: var(--bialy); background: var(--grafit-2); }
.nav a[aria-current="page"] { color: var(--mosiadz); }
.header .btn { min-height: 44px; padding: .55rem 1rem; }
.menu-btn { display: none; background: none; border: 1px solid var(--grafit-3); color: var(--bialy); border-radius: var(--r); width: 48px; height: 48px; cursor: pointer; }
.menu-btn svg { width: 24px; height: 24px; margin: auto; }

@media (max-width: 1100px) {
  .menu-btn { display: grid; }
  .header .btn--glowny { display: none; }
  .nav { position: absolute; left: 0; right: 0; top: 100%; background: var(--grafit); border-bottom: 1px solid var(--grafit-3); display: none; }
  .nav.otwarte { display: block; }
  .nav ul { flex-direction: column; padding: .5rem var(--gutter) 1rem; }
  .nav a { padding: .9rem .5rem; border-bottom: 1px solid var(--grafit-2); border-radius: 0; }
}

/* Hero */
.hero { background: var(--grafit); color: var(--na-ciemnym); position: relative; overflow: hidden; }
.hero .wrap { display: grid; grid-template-columns: 1.05fr .95fr; gap: clamp(28px, 5vw, 64px); align-items: center; padding-block: clamp(44px, 7vw, 88px); }
.hero h1 { color: var(--bialy); }
.hero h1 em { font-style: normal; color: var(--mosiadz); display: block; }
.hero__tekst { display: grid; gap: 1.4rem; min-width: 0; }
.hero__lead { font-size: 1.15rem; color: var(--na-ciemnym); }
.hero__cta { display: flex; flex-wrap: wrap; gap: .8rem; }
.hero__fakty { display: flex; flex-wrap: wrap; gap: .5rem 1.4rem; padding: 0; margin: .4rem 0 0; list-style: none; font-size: .95rem; color: var(--na-ciemnym-2); }
.hero__fakty li { display: inline-flex; align-items: center; gap: .45rem; }
.hero__fakty svg { width: 18px; height: 18px; color: var(--mosiadz); flex: none; }
.hero__foto { position: relative; min-width: 0; }
.hero__foto .foto { aspect-ratio: 4 / 3.4; border-radius: var(--r); }
.hero__karta {
  position: absolute; left: -18px; bottom: -18px; background: var(--bialy); color: var(--tekst);
  border-radius: var(--r); padding: .9rem 1.1rem; display: grid; gap: .1rem; box-shadow: 0 18px 40px rgba(0,0,0,.35);
  max-width: 260px;
}
.hero__karta strong { font-family: var(--f-display); font-stretch: 112%; font-size: 1.05rem; }
.hero__karta span { font-size: .9rem; color: var(--tekst-2); }
.hero__linia { position: absolute; right: -80px; top: -60px; width: 420px; opacity: .08; pointer-events: none; }
@media (max-width: 860px) {
  .hero .wrap { grid-template-columns: 1fr; }
  .hero__karta { left: 12px; bottom: 12px; }
}

.podhero { background: var(--grafit); color: var(--na-ciemnym); }
.podhero .wrap { padding-block: clamp(40px, 6vw, 72px); display: grid; gap: 1rem; }
.podhero h1 { color: var(--bialy); font-size: clamp(2rem, 4.6vw, 3.2rem); }
.podhero p { color: var(--na-ciemnym); font-size: 1.1rem; }
.okruszki { font-size: .875rem; color: var(--na-ciemnym-2); }
.okruszki a { color: var(--na-ciemnym-2); }

/* Placeholdery zdjęć: <img> zakrywa tło, gdy plik istnieje */
.foto {
  position: relative; overflow: hidden; margin: 0; background-color: var(--grafit-2);
  background-image:
    radial-gradient(120% 80% at 80% 10%, rgba(201,163,91,.18), transparent 60%),
    repeating-linear-gradient(135deg, rgba(255,255,255,.035) 0 2px, transparent 2px 14px);
  max-width: 100%;
}
.foto img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; z-index: 1; }
.foto figcaption {
  position: absolute; left: 12px; right: 12px; bottom: 12px; z-index: 0;
  font-size: .78rem; line-height: 1.35; color: var(--na-ciemnym-2);
  display: flex; gap: .5rem; align-items: flex-start;
}
.foto figcaption::before { content: ""; flex: none; width: 16px; height: 12px; margin-top: 2px; border: 1.5px solid var(--mosiadz); border-radius: 2px; }

/* Wyróżniki */
.wyrozniki { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--linia); border: 1px solid var(--linia); border-radius: var(--r); overflow: hidden; }
.wyroznik { background: var(--bialy); padding: 1.6rem 1.4rem; display: grid; gap: .6rem; align-content: start; }
.wyroznik svg { width: 30px; height: 30px; color: var(--mosiadz-ciemny); }
.wyroznik p { color: var(--tekst-2); font-size: .98rem; }
@media (max-width: 900px) { .wyrozniki { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 520px) { .wyrozniki { grid-template-columns: 1fr; } }

/* Usługi */
.uslugi-siatka { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); gap: 16px; }
.usluga {
  background: var(--bialy); border: 1px solid var(--linia); border-radius: var(--r);
  padding: 1.4rem; display: grid; grid-template-rows: auto auto 1fr auto; gap: .7rem; min-width: 0;
  text-decoration: none; transition: border-color .15s, transform .15s;
}
a.usluga:hover { border-color: var(--mosiadz-ciemny); transform: translateY(-2px); }
.usluga__gora { display: flex; justify-content: space-between; align-items: center; gap: .6rem; }
.usluga__ikona { width: 44px; height: 44px; border-radius: var(--r); display: grid; place-items: center; background: var(--grafit); color: var(--mosiadz); }
.usluga__ikona svg { width: 24px; height: 24px; }
.usluga p { color: var(--tekst-2); font-size: .98rem; }
.usluga__cena { font-family: var(--f-display); font-stretch: 108%; font-weight: 700; font-variant-numeric: tabular-nums; border-top: 1px solid var(--linia); padding-top: .8rem; display: flex; justify-content: space-between; gap: .5rem; flex-wrap: wrap; }
.usluga__cena small { font-family: var(--f-body); font-weight: 500; color: var(--tekst-2); font-size: .85rem; }
.znaczek { font-size: .72rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: .25rem .55rem; border-radius: 99px; white-space: nowrap; }
.znaczek--promo { background: var(--promo); color: var(--bialy); }
.znaczek--nowosc { background: var(--nowosc); color: var(--bialy); }

.kategoria { display: grid; gap: 1.2rem; padding-block: 2rem; border-top: 1px solid var(--linia); }
.kategoria:first-of-type { border-top: 0; padding-top: 0; }
.kategoria__opis { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: .5rem 2rem; }
.kategoria__opis p { color: var(--tekst-2); }

/* Marki */
.marki { display: flex; flex-wrap: wrap; gap: 12px; padding: 0; margin: 0; list-style: none; }
.marki li { flex: 1 1 180px; border: 1px solid var(--grafit-3); border-radius: var(--r); padding: 1.1rem 1.2rem; display: grid; gap: .2rem; }
.marki strong { font-family: var(--f-display); font-stretch: 125%; font-size: 1.35rem; color: var(--bialy); letter-spacing: .04em; }
.marki span { color: var(--na-ciemnym-2); font-size: .92rem; }

/* Kroki wizyty (prawdziwa kolejność) */
.kroki { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; counter-reset: k; padding: 0; margin: 0; list-style: none; }
.kroki li { counter-increment: k; display: grid; gap: .5rem; align-content: start; padding-top: 1rem; border-top: 3px solid var(--mosiadz); }
.kroki li::before { content: "Krok " counter(k); font-family: var(--f-display); font-stretch: 112%; font-weight: 700; font-size: .8rem; letter-spacing: .14em; text-transform: uppercase; color: var(--mosiadz); }
.kroki p { color: var(--na-ciemnym-2); font-size: .98rem; }
@media (max-width: 860px) { .kroki { grid-template-columns: 1fr 1fr; } }
@media (max-width: 520px) { .kroki { grid-template-columns: 1fr; } }

/* Dwie kolumny */
.dwie { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(28px, 5vw, 64px); align-items: start; }
.dwie > * { min-width: 0; }
@media (max-width: 860px) { .dwie { grid-template-columns: 1fr; } }
.lista-check { list-style: none; padding: 0; margin: 0; display: grid; gap: .6rem; }
.lista-check li { display: grid; grid-template-columns: 22px 1fr; gap: .6rem; }
.lista-check svg { width: 20px; height: 20px; margin-top: 3px; color: var(--mosiadz-ciemny); }
.sekcja--ciemna .lista-check svg { color: var(--mosiadz); }

/* Aktualności */
.aktualnosci { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.wpis { display: grid; gap: .5rem; padding: 1.3rem; background: var(--bialy); border-radius: var(--r); border: 1px solid var(--linia); align-content: start; }
.wpis time { font-size: .85rem; color: var(--mosiadz-ciemny); font-weight: 700; font-variant-numeric: tabular-nums; }
.wpis p { color: var(--tekst-2); font-size: .98rem; }
@media (max-width: 860px) { .aktualnosci { grid-template-columns: 1fr; } }

/* Opinie */
.opinie { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.opinia { border: 1px dashed var(--linia); border-radius: var(--r); padding: 1.3rem; display: grid; gap: .7rem; background: var(--bialy); align-content: start; }
.opinia p { color: var(--tekst-2); }
.opinia footer { font-size: .88rem; font-weight: 700; }
.uzupelnij { background: #FFF4D6; color: #5A4310; font-size: .8rem; font-weight: 700; padding: .15rem .45rem; border-radius: 4px; display: inline-block; }
@media (max-width: 860px) { .opinie { grid-template-columns: 1fr; } }

/* Zespół i galeria */
.zespol { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
.osoba { display: grid; gap: .6rem; align-content: start; }
.osoba .foto { aspect-ratio: 4 / 5; border-radius: var(--r); }
.osoba span { color: var(--tekst-2); font-size: .95rem; }
@media (max-width: 900px) { .zespol { grid-template-columns: repeat(2, 1fr); } }
.galeria { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.galeria .foto { aspect-ratio: 4 / 3; border-radius: var(--r); }
.galeria .foto--duze { grid-column: span 2; grid-row: span 2; aspect-ratio: auto; min-height: 260px; }
@media (max-width: 640px) { .galeria { grid-template-columns: 1fr 1fr; } .galeria .foto--duze { grid-column: span 2; grid-row: auto; aspect-ratio: 4 / 3; } }

/* Cennik */
.tabela-wrap { overflow-x: auto; border: 1px solid var(--linia); border-radius: var(--r); background: var(--bialy); }
table { width: 100%; border-collapse: collapse; font-size: 1rem; }
caption { text-align: left; padding: 1rem 1.2rem; font-family: var(--f-display); font-stretch: 112%; font-weight: 700; font-size: 1.1rem; background: var(--grafit); color: var(--bialy); }
th, td { text-align: left; padding: .85rem 1.2rem; border-top: 1px solid var(--linia); vertical-align: top; }
thead th { font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--tekst-2); border-top: 0; background: var(--stal); }
td.kwota, th.kwota { text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; font-weight: 700; }
td small { display: block; color: var(--tekst-2); font-size: .88rem; }
.cennik-tabele { display: grid; gap: 20px; }
.przypis { font-size: .92rem; color: var(--tekst-2); }

/* Pakiety */
.pakiety { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; align-items: stretch; }
.pakiet { border: 1px solid var(--linia); border-radius: var(--r); padding: 1.5rem; display: grid; grid-template-rows: auto auto auto 1fr auto; gap: .9rem; background: var(--bialy); }
.pakiet--wyrozniony { background: var(--grafit); color: var(--na-ciemnym); border-color: var(--grafit); }
.pakiet--wyrozniony h3 { color: var(--bialy); }
.pakiet--wyrozniony .lista-check svg { color: var(--mosiadz); }
.pakiet__cena { font-family: var(--f-display); font-stretch: 112%; font-size: 1.9rem; font-weight: 800; font-variant-numeric: tabular-nums; }
.pakiet__cena small { font-family: var(--f-body); font-size: .9rem; font-weight: 500; color: var(--tekst-2); }
.pakiet--wyrozniony .pakiet__cena small { color: var(--na-ciemnym-2); }
.pakiet > p { font-size: .98rem; color: var(--tekst-2); }
.pakiet--wyrozniony > p { color: var(--na-ciemnym-2); }
@media (max-width: 900px) { .pakiety { grid-template-columns: 1fr; } }

/* FAQ */
.faq { display: grid; gap: 10px; max-width: 860px; }
.faq details { border: 1px solid var(--linia); border-radius: var(--r); background: var(--bialy); }
.faq summary { cursor: pointer; padding: 1.1rem 1.2rem; font-weight: 700; list-style: none; display: flex; justify-content: space-between; gap: 1rem; }
.faq summary::-webkit-details-marker { display: none; }
.faq summary::after { content: "+"; font-family: var(--f-display); font-size: 1.4rem; line-height: 1; color: var(--mosiadz-ciemny); }
.faq details[open] summary::after { content: "–"; }
.faq details p { padding: 0 1.2rem 1.2rem; color: var(--tekst-2); }

/* Kontakt */
.kontakt-siatka { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
.kafel { border: 1px solid var(--linia); border-radius: var(--r); padding: 1.4rem; display: grid; gap: .7rem; align-content: start; background: var(--bialy); min-width: 0; }
.kafel--ciemny { background: var(--grafit); color: var(--na-ciemnym); border-color: var(--grafit); }
.kafel--ciemny h3 { color: var(--bialy); }
.duzy-numer { font-family: var(--f-display); font-stretch: 112%; font-size: clamp(1.6rem, 4vw, 2.1rem); font-weight: 800; color: var(--bialy); text-decoration: none; font-variant-numeric: tabular-nums; }
.akcje { display: flex; flex-wrap: wrap; gap: .6rem; }
.godziny { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.godziny td, .godziny th { border-top: 1px solid var(--linia); padding: .55rem 0; font-size: 1rem; }
.godziny th { font-weight: 500; }
.godziny td { text-align: right; font-weight: 700; }
.godziny tr.dzis th, .godziny tr.dzis td { color: var(--mosiadz-ciemny); }
.godziny tr:first-child th, .godziny tr:first-child td { border-top: 0; }
@media (max-width: 760px) { .kontakt-siatka { grid-template-columns: 1fr; } }

.mapa { position: relative; border-radius: var(--r); overflow: hidden; background: var(--grafit-2); min-height: 340px; display: grid; place-items: center; color: var(--na-ciemnym); }
.mapa svg.trasa { position: absolute; inset: 0; width: 100%; height: 100%; }
.mapa__info { position: relative; z-index: 1; display: grid; gap: .8rem; justify-items: center; text-align: center; padding: 1.5rem; }
.mapa__info strong { font-family: var(--f-display); font-stretch: 112%; font-size: 1.2rem; color: var(--bialy); }
.mapa iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; z-index: 2; }

/* Formularze */
.formularz { display: grid; gap: 1rem; }
.pola { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
@media (max-width: 560px) { .pola { grid-template-columns: 1fr; } }
.pole { display: grid; gap: .35rem; min-width: 0; }
.pole label { font-weight: 700; font-size: .95rem; }
.pole .pomoc { font-size: .85rem; color: var(--tekst-2); }
input, select, textarea {
  font: inherit; font-size: 1rem; color: var(--tekst); background: var(--bialy);
  border: 1.5px solid #B9BFC8; border-radius: var(--r); padding: .7rem .8rem; min-height: 48px; width: 100%;
}
textarea { min-height: 120px; resize: vertical; }
input:focus, select:focus, textarea:focus { outline: 3px solid rgba(201,163,91,.55); border-color: var(--mosiadz-ciemny); }
.zgoda { display: grid; grid-template-columns: 22px 1fr; gap: .6rem; font-size: .9rem; color: var(--tekst-2); }
.zgoda input { min-height: 0; width: 20px; height: 20px; margin-top: 2px; }
.komunikat { padding: .9rem 1rem; border-radius: var(--r); background: #E6F2EC; color: #1F5F4A; font-weight: 600; }

/* Pas CTA */
.pas-cta { background: var(--grafit-2); color: var(--na-ciemnym); }
.pas-cta .wrap { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 1.5rem; padding-block: clamp(40px, 6vw, 64px); }
.pas-cta h2 { color: var(--bialy); }
.pas-cta p { color: var(--na-ciemnym-2); margin-top: .5rem; }

/* Stopka */
.stopka { background: var(--grafit); color: var(--na-ciemnym-2); font-size: .95rem; padding-bottom: 88px; }
.stopka .wrap { display: grid; grid-template-columns: 1.3fr 1fr 1fr 1.3fr; gap: 32px; padding-block: 56px 32px; }
.stopka h3 { color: var(--bialy); font-size: 1rem; margin-bottom: .8rem; }
.stopka ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .45rem; }
.stopka a { color: var(--na-ciemnym); text-decoration: none; }
.stopka a:hover { color: var(--mosiadz); text-decoration: underline; }
.stopka .logo svg { height: 40px; }
.stopka__dol { border-top: 1px solid var(--grafit-3); }
.stopka__dol .wrap { display: flex; flex-wrap: wrap; justify-content: space-between; gap: .6rem; padding-block: 1.2rem; grid-template-columns: none; font-size: .85rem; }
.social { display: flex; gap: .6rem; }
.social a { width: 44px; height: 44px; display: grid; place-items: center; border: 1px solid var(--grafit-3); border-radius: var(--r); }
.social svg { width: 20px; height: 20px; }
.newsletter { display: flex; gap: .5rem; flex-wrap: wrap; }
.newsletter input { flex: 1 1 180px; background: var(--grafit-2); color: var(--bialy); border-color: var(--grafit-3); }
.newsletter input::placeholder { color: var(--na-ciemnym-2); }
.newsletter .komunikat { flex-basis: 100%; }
@media (max-width: 900px) { .stopka .wrap { grid-template-columns: 1fr 1fr; } }
@media (max-width: 560px) { .stopka .wrap { grid-template-columns: 1fr; } }
@media (min-width: 1101px) { .stopka { padding-bottom: 0; } }

/* Dolny pasek na telefonie */
.pasek-mobilny {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 60; display: grid; grid-template-columns: 1.4fr 1fr 1fr;
  background: var(--grafit); border-top: 1px solid var(--grafit-3);
  padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px)); gap: 8px;
}
.pasek-mobilny a { min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border-radius: var(--r); text-decoration: none; font-weight: 700; font-size: .82rem; color: var(--bialy); background: var(--grafit-2); }
.pasek-mobilny a:first-child { background: var(--mosiadz); color: var(--grafit); flex-direction: row; gap: .5rem; font-size: 1rem; }
.pasek-mobilny svg { width: 20px; height: 20px; }
@media (min-width: 1101px) { .pasek-mobilny { display: none; } }

.notka-demo { font-size: .85rem; color: var(--tekst-2); margin-top: 1rem; }
.mt { margin-top: clamp(28px, 4vw, 44px); }
.centr { display: flex; flex-wrap: wrap; gap: .8rem; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* poprawki po przeglądzie */
blockquote.opinia { margin: 0; }
.hero__foto figcaption { top: 12px; bottom: auto; }
.mapa__info { background: rgba(21,23,28,.86); border-radius: var(--r); margin: 16px; }
@media (max-width: 600px) { .topbar__adres { display: none; } }

/* ===== Elementy dynamiczne ===== */
.acc { font-style: normal; color: var(--mosiadz-ciemny); }
.hero .acc, .podhero .acc, .sekcja--ciemna .acc { color: var(--mosiadz); }
.tekst-bogaty { display: grid; gap: .9rem; }

/* Pasek komunikatów */
.topbar .wrap { align-items: center; }
.ticker { display: flex; align-items: center; gap: .6rem; min-width: 0; flex: 1 1 320px; }
.ticker__licz { font-variant-numeric: tabular-nums; font-size: .75rem; color: var(--na-ciemnym-2); border: 1px solid var(--grafit-3); border-radius: 99px; padding: .05rem .45rem; flex: none; }
.ticker__okno { position: relative; overflow: hidden; height: 1.5em; flex: 1; min-width: 0; }
.ticker__el { position: absolute; inset: 0; display: flex; gap: .5rem; align-items: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; transform: translateY(110%); opacity: 0; transition: transform .5s cubic-bezier(.2,.7,.2,1), opacity .5s; }
.ticker__el.on { transform: none; opacity: 1; }
.ticker__el.off { transform: translateY(-110%); opacity: 0; }
.ticker__el b { color: var(--mosiadz); font-weight: 700; }
.ticker__el a { color: var(--bialy); text-decoration: underline; text-underline-offset: 2px; overflow: hidden; text-overflow: ellipsis; }
.status { white-space: nowrap; }
.status i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #D9776B; }
.status[data-stan="otwarte"] i { background: #5FBF8F; animation: puls 2s infinite; }
.status[data-stan="wkrotce"] i { background: #E0B347; animation: puls 2s infinite; }
@keyframes puls { 0% { box-shadow: 0 0 0 0 rgba(95,191,143,.55); } 70% { box-shadow: 0 0 0 7px rgba(95,191,143,0); } 100% { box-shadow: 0 0 0 0 rgba(95,191,143,0); } }
.status-duzy { display: inline-flex; align-items: center; gap: .6rem; padding: .5rem .9rem; border-radius: 99px; font-weight: 700; font-size: .95rem; background: #FBE9E6; color: #8E2F22; }
.status-duzy i { width: 10px; height: 10px; border-radius: 50%; background: currentColor; }
.status-duzy[data-stan="otwarte"] { background: #E3F3EA; color: #1F6B45; }
.status-duzy[data-stan="otwarte"] i { animation: puls 2s infinite; }
.status-duzy[data-stan="wkrotce"] { background: #FCF1D6; color: #7A5A0E; }

/* Slider w nagłówku */
.slider { position: relative; aspect-ratio: 4 / 3.4; border-radius: var(--r); overflow: hidden; background: var(--grafit-2); max-width: 100%; }
.slajd { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
.slajd.on { opacity: 1; z-index: 1; }
.slajd > img, .slajd > .bp { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.0); transition: transform 7s ease-out; }
.slajd.on > img, .slajd.on > .bp { transform: scale(1.07); }
.slajd figcaption { position: absolute; left: 14px; bottom: 14px; z-index: 2; font-size: .82rem; color: var(--na-ciemnym); background: rgba(21,23,28,.72); padding: .3rem .6rem; border-radius: 4px; max-width: calc(100% - 28px); }
.kropki { position: absolute; right: 14px; bottom: 14px; z-index: 3; display: flex; gap: 4px; }
.kropki button { width: 28px; height: 28px; border: 0; background: none; padding: 0; cursor: pointer; display: grid; place-items: center; }
.kropki button::after { content: ""; width: 9px; height: 9px; border-radius: 99px; background: rgba(255,255,255,.45); transition: width .3s, background .3s; }
.kropki button[aria-current="true"]::after { width: 22px; background: var(--mosiadz); }

/* Grafiki techniczne (rysunki SVG w stylu dokumentacji serwisowej) */
.bp { display: block; background: #191C22; }
.bp .l { fill: none; stroke: #C9A35B; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.bp .l2 { fill: none; stroke: #6E7480; stroke-width: 1.2; stroke-linecap: round; }
.bp .siatka { stroke: #262A32; stroke-width: 1; }
.bp .wym { fill: none; stroke: #8C929C; stroke-width: 1; }
.bp text { font-family: var(--f-display); font-size: 13px; fill: #8C929C; letter-spacing: .08em; }
.bp .hl { fill: none; stroke: #FFFFFF; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
.bp .rys { stroke-dasharray: 1; stroke-dashoffset: 0; }
.slajd.on .bp .rys, .bp.anim .rys { animation: rysuj 2.6s cubic-bezier(.4,.1,.2,1) both; }
@keyframes rysuj { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
.bp .skan { animation: skan 3.2s ease-in-out infinite alternate; }
@keyframes skan { from { transform: translateX(0); } to { transform: translateX(var(--skan, 300px)); } }
.bp .obrot { transform-box: fill-box; transform-origin: center; animation: obrot 8s linear infinite; }
@keyframes obrot { to { transform: rotate(360deg); } }
.bp .przeplyw { stroke-dasharray: 6 10; animation: przeplyw 1.4s linear infinite; }
@keyframes przeplyw { to { stroke-dashoffset: -32; } }
.bp .migaj { animation: migaj 1.6s ease-in-out infinite; }
@keyframes migaj { 50% { opacity: .25; } }

/* Hero – animacja linii S */
.hero__linia path { stroke-dasharray: 140; animation: rysuj-s 2.4s .2s cubic-bezier(.5,0,.2,1) both; }
@keyframes rysuj-s { from { stroke-dashoffset: 140; } to { stroke-dashoffset: 0; } }
.hero__linia { opacity: .1; }
.hero__karta { animation: unies 5s ease-in-out infinite alternate; z-index: 4; }
@keyframes unies { from { transform: translateY(0); } to { transform: translateY(-6px); } }

/* Odsłanianie przy przewijaniu: tylko przesunięcie, treść zawsze widoczna */
.odslon { transition: transform .7s cubic-bezier(.2,.7,.2,1); }
.odslon.czeka { transform: translateY(18px); }

/* Karty – mikrointerakcje */
.usluga, .wpis, .pakiet, .promo { position: relative; }
.usluga::after, .wpis::after { content: ""; position: absolute; left: 1.4rem; right: 1.4rem; bottom: -1px; height: 2px; background: var(--mosiadz-ciemny); transform: scaleX(0); transform-origin: left; transition: transform .35s ease; }
.usluga:hover::after, .wpis:hover::after, .usluga:focus-within::after { transform: scaleX(1); }
.usluga:hover .usluga__ikona svg { animation: drgnij .5s ease; }
@keyframes drgnij { 30% { transform: rotate(-10deg); } 60% { transform: rotate(8deg); } }
.usluga__foto { aspect-ratio: 16 / 9; border-radius: 4px; overflow: hidden; margin: -.4rem -.4rem 0; background: var(--grafit-2); }
.usluga__foto img, .usluga__foto .bp { width: 100%; height: 100%; object-fit: cover; }
.usluga__akcje { display: flex; flex-wrap: wrap; gap: .5rem; }
.usluga__akcje .btn { min-height: 40px; padding: .45rem .8rem; font-size: .9rem; }
.usluga__meta { font-size: .88rem; color: var(--tekst-2); display: flex; gap: .3rem 1rem; flex-wrap: wrap; }
.znaczki { display: flex; gap: .35rem; flex-wrap: wrap; justify-content: flex-end; }
.znaczek--wlasny { background: var(--grafit); color: var(--mosiadz); }
.znaczek--promo { animation: blysk 3s ease-in-out infinite; }
@keyframes blysk { 50% { box-shadow: 0 0 0 4px rgba(138,106,46,.18); } }

/* Promocje */
.promocje { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; }
.promo { background: var(--grafit); color: var(--na-ciemnym); border-radius: var(--r); overflow: hidden; display: grid; grid-template-rows: auto 1fr; }
.promo__foto { aspect-ratio: 16 / 8; position: relative; background: var(--grafit-2); }
.promo__foto img, .promo__foto .bp { width: 100%; height: 100%; object-fit: cover; }
.promo__plak { position: absolute; left: 14px; top: 14px; background: var(--mosiadz); color: var(--grafit); font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 1.15rem; padding: .3rem .7rem; border-radius: 4px; }
.promo__tresc { padding: 1.3rem; display: grid; gap: .8rem; align-content: start; }
.promo__tresc h3 { color: var(--bialy); font-size: 1.25rem; }
.promo__tresc p { color: var(--na-ciemnym-2); }
.promo__termin { display: grid; gap: .45rem; font-size: .9rem; }
.promo__termin div { display: flex; justify-content: space-between; gap: .5rem; flex-wrap: wrap; }
.promo__termin strong { color: var(--bialy); font-variant-numeric: tabular-nums; }
.postep { height: 6px; background: var(--grafit-3); border-radius: 99px; overflow: hidden; }
.postep i { display: block; height: 100%; background: linear-gradient(90deg, var(--mosiadz-ciemny), var(--mosiadz)); border-radius: 99px; transform-origin: left; animation: wypelnij 1.4s cubic-bezier(.2,.7,.2,1) both; }
@keyframes wypelnij { from { transform: scaleX(0); } }

/* Galeria: filtry i lightbox */
.filtry { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.2rem; }
.filtr { min-height: 40px; padding: .4rem .9rem; border-radius: 99px; border: 1.5px solid var(--linia); background: var(--bialy); font: inherit; font-weight: 600; font-size: .92rem; cursor: pointer; color: var(--tekst); }
.filtr[aria-pressed="true"] { background: var(--grafit); color: var(--bialy); border-color: var(--grafit); }
.galeria button.foto { border: 0; padding: 0; cursor: zoom-in; width: 100%; display: block; text-align: left; font: inherit; }
.galeria .foto .bp, .galeria .foto img { transition: transform .5s ease; }
.galeria button.foto:hover .bp, .galeria button.foto:hover img { transform: scale(1.04); }
.galeria .foto figcaption, .galeria .foto .podpis { z-index: 2; }
.galeria .podpis { position: absolute; left: 0; right: 0; bottom: 0; padding: .7rem .9rem; font-size: .85rem; color: var(--bialy); background: linear-gradient(transparent, rgba(21,23,28,.85)); }
.lightbox { position: fixed; inset: 0; z-index: 900; background: rgba(12,13,16,.94); display: grid; grid-template-rows: auto 1fr auto; padding: max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px)); color: var(--na-ciemnym); }
.lightbox__gora { display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
.lightbox__obraz { display: grid; place-items: center; min-height: 0; position: relative; }
.lightbox__obraz img, .lightbox__obraz .bp { max-width: min(1100px, 100%); max-height: 100%; width: auto; height: auto; object-fit: contain; border-radius: 4px; }
.lightbox__obraz .bp { width: min(1000px, 100%); aspect-ratio: 4 / 3; height: auto; }
.lightbox__nav { position: absolute; top: 50%; transform: translateY(-50%); width: 52px; height: 52px; border-radius: 50%; border: 1px solid var(--grafit-3); background: rgba(21,23,28,.8); color: var(--bialy); cursor: pointer; display: grid; place-items: center; }
.lightbox__nav svg { width: 22px; height: 22px; }
.lightbox__nav--l { left: 0; } .lightbox__nav--l svg { transform: rotate(180deg); }
.lightbox__nav--p { right: 0; }
.lightbox__x { width: 48px; height: 48px; border-radius: var(--r); border: 1px solid var(--grafit-3); background: none; color: var(--bialy); font-size: 1.6rem; cursor: pointer; }
.lightbox__dol { text-align: center; padding-top: .8rem; }

/* Monogram w miejsce zdjęcia osoby */
.monogram { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-stretch: 125%; font-weight: 800; font-size: 2.6rem; color: var(--mosiadz); letter-spacing: .04em; }

/* Kroki wizyty: linia postępu */
.kroki li { position: relative; border-top-color: var(--linia); }
.kroki li::after { content: ""; position: absolute; top: -3px; left: 0; height: 3px; width: 100%; background: var(--mosiadz); transform: scaleX(1); transform-origin: left; transition: transform .8s cubic-bezier(.2,.7,.2,1); transition-delay: calc(var(--i, 0) * .25s); }
.kroki.czeka li::after { transform: scaleX(0); }
.sekcja--ciemna .kroki li { border-top-color: var(--grafit-3); }

/* Sygnał diagnostyczny w tle sekcji specjalizacji */
.sygnal { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; opacity: .55; }
.z-sygnalem { position: relative; overflow: hidden; }
.z-sygnalem > .wrap { position: relative; z-index: 1; }
.marki li { background: rgba(21,23,28,.6); backdrop-filter: blur(2px); transition: border-color .2s, transform .2s; }
.marki li:hover { border-color: var(--mosiadz); transform: translateY(-2px); }

/* Mapa – animowana trasa */
.mapa .trasa-anim { stroke-dasharray: 2 10; animation: przeplyw 1.6s linear infinite; }
.mapa .pinezka { animation: unies 1.6s ease-in-out infinite alternate; transform-box: fill-box; }

/* Zmiany w godzinach */
.zmiany { display: grid; gap: .5rem; margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--linia); }
.zmiany h4 { margin: 0; font-family: var(--f-display); font-stretch: 112%; font-size: 1rem; }
.zmiany li { display: flex; justify-content: space-between; gap: 1rem; font-size: .95rem; }
.zmiany ul { list-style: none; margin: 0; padding: 0; display: grid; gap: .35rem; }
.zmiany time { font-weight: 700; font-variant-numeric: tabular-nums; }

/* Opinie: podsumowanie */
.oceny { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 2rem; margin-bottom: 1.5rem; }
.oceny__srednia { font-family: var(--f-display); font-stretch: 112%; font-weight: 800; font-size: 2.6rem; line-height: 1; }
.gwiazdki { display: inline-flex; gap: 2px; color: var(--mosiadz); }
.gwiazdki svg { width: 18px; height: 18px; }
.gwiazdki .pusta { color: var(--linia); }
.opinia--prawdziwa { border-style: solid; }
.brak-opinii { border: 1px dashed var(--linia); border-radius: var(--r); padding: 1.5rem; display: grid; gap: .8rem; justify-items: start; background: var(--bialy); }

/* Widoki (podstrony w jednym pliku) */
.widok-wejscie { animation: wejscie .45s ease both; }
@keyframes wejscie { from { opacity: .4; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* Kłódka panelu */
.cms-klodka { position: fixed; left: 14px; bottom: calc(14px + env(safe-area-inset-bottom, 0px)); z-index: 70; height: 40px; min-width: 40px; padding: 0 .7rem; border-radius: 99px; border: 1px solid var(--grafit-3); background: rgba(21,23,28,.86); color: var(--na-ciemnym-2); display: inline-flex; align-items: center; justify-content: center; gap: .4rem; cursor: pointer; font: 600 .85rem var(--f-body); }
.cms-klodka svg { width: 18px; height: 18px; }
.cms-klodka:hover { color: var(--mosiadz); border-color: var(--mosiadz); }
@media (max-width: 1100px) { .cms-klodka { bottom: calc(84px + env(safe-area-inset-bottom, 0px)); } }

@media (max-width: 600px) { .ticker { flex-basis: 100%; order: 2; } }

@media (prefers-reduced-motion: reduce) {
  .ticker__el { transition: none; }
  .slajd { transition: none; }
  .slajd.on > img, .slajd.on > .bp { transform: none; }
  .bp .rys, .bp .skan, .bp .obrot, .bp .przeplyw, .bp .migaj, .hero__linia path, .hero__karta, .postep i, .znaczek--promo, .status i, .status-duzy i, .mapa .trasa-anim, .mapa .pinezka { animation: none !important; }
  .odslon.czeka, .kroki.czeka li::after { transform: none; }
  .sygnal { display: none; }
}

/* uzupełnienia */
.usluga { display: flex; flex-direction: column; }
.usluga__cena { margin-top: auto; }
.usluga__meta svg, .ik-mala { width: 16px; height: 16px; flex: none; }
.usluga__meta { align-items: center; }
td.czas { white-space: nowrap; color: var(--tekst-2); font-size: .92rem; }
.link-btn { background: none; border: 0; padding: 0; font: inherit; color: var(--na-ciemnym); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; }
.link-btn:hover { color: var(--mosiadz); }
.hero__lead p { color: var(--na-ciemnym); }
.hero__lead { display: grid; gap: .6rem; }
.faq details p { padding: 0 1.2rem 1.2rem; }
.osoba .foto { background-color: var(--grafit); }

.nav a { white-space: nowrap; padding: .6rem .65rem; }
.header .btn { white-space: nowrap; }
@media (max-width: 1240px) and (min-width: 1101px) { .nav a { padding: .6rem .5rem; font-size: .95rem; } .logo svg { height: 38px; } }

/* ===== PANEL ADMINISTRATORA (prefiks .cmsp-) ===== */
.cmsp, .cmsp *, .cmsp-login, .cmsp-login *, .cmsp-modal-tlo, .cmsp-modal-tlo * { box-sizing: border-box; }
.cmsp {
  --p-grafit: #15171C; --p-grafit-2: #22252C; --p-mosiadz: #C9A35B; --p-mosiadz-c: #8A6A2E;
  --p-tlo: #F3F4F6; --p-karta: #FFFFFF; --p-tekst: #15171C; --p-tekst-2: #565C66; --p-linia: #DCDFE4;

function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function fmtLinia(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, '<em class="acc">$1</em>')
    .replace(/\[DO UZUPEŁNIENIA[^\]]*\]/g, function (m) { return '<span class="uzupelnij">' + m.slice(1, -1) + "</span>"; }).replace(/\n/g, "<br>");
}
function fmt(s) { return String(s || "").split(/\n\s*\n/).filter(function (p) { return p.trim(); }).map(function (p) { return "<p>" + fmtLinia(p.trim()) + "</p>"; }).join(""); }
function cyfry(t) { return String(t || "").replace(/\D/g, ""); }
function telHref() { var c = cyfry(S.kontakt.telefon); return "tel:" + (c.length === 9 ? "+48" + c : c); }
function smsHref(body) { var c = cyfry(S.kontakt.sms || S.kontakt.telefon); return "sms:" + (c.length === 9 ? "+48" + c : c) + (body ? "?body=" + encodeURIComponent(body) : ""); }

function obraz(src, alt, cls) {

  if (String(src).indexOf("bp:") === 0) return grafika(src.slice(3), cls);
  return '<img src="' + esc(src) + '" alt="' + esc(alt || "") + '" loading="lazy" decoding="async"' + (cls ? ' class="' + cls + '"' : "") + ' onerror="this.remove()">';
}

function trasa(hash, przewin) {

    var s = S.sekcje.filter(function (x) { return x.id === h; })[0];
    if (s) { WIDOK = s.widok; cel = "sek-" + h; }

    '<div id="cmsp-reset-krok2" hidden style="display:grid;gap:.6rem"><label class="cmsp-check"><input type="checkbox" id="cmsp-reset-zgoda">Rozumiem, że wszystkie zmiany zostaną bezpowrotnie usunięte.</label><div><button type="button" class="cmsp-btn cmsp-btn--usun cmsp-potw" data-akcja="reset-2" disabled>Tak, przywróć treści początkowe</button></div></div></div>';
}

/* ---------- pulpit ---------- */
function stronaPulpit() {
  var D = dzisISO(), st = stanOtwarcia();
  var prA = liczAktywne("promocje"), prZ = widoczne(S.promocje).filter(function (x) { return statusCzasowy(x) === "zaplanowana"; }).length;
  var akA = liczAktywne("aktualnosci");
  var kafel = function (str, et, wart, dop, cls, stan) { return '<button type="button" class="cmsp-kafel ' + (cls || "") + '" data-akcja="idz" data-strona="' + str + '"' + (stan ? ' data-stan="' + stan + '"' : "") + "><span>" + et + "</span><strong>" + wart + "</strong><small>" + dop + "</small></button>"; };
  var stanTxt = st.tekst.split(" · ");
  return '<div class="cmsp-glowa"><div><h1>Dzień dobry!</h1><p>' + dataSlownie(D) + " · " + esc(S.firma.nazwa) + '</p></div><div class="cmsp-szybkie"><button type="button" class="cmsp-btn cmsp-btn--gl" data-akcja="szybko" data-kol="promocje">+ Promocja</button><button type="button" class="cmsp-btn cmsp-btn--gl" data-akcja="szybko" data-kol="aktualnosci">+ Aktualność</button><button type="button" class="cmsp-btn" data-akcja="idz" data-strona="godziny">' + ico("zegar") + "Godziny</button></div></div>" +
    '<div class="cmsp-kafle">' +
    kafel("godziny", "Warsztat teraz", "<i></i>" + (st.stan === "zamkniete" ? "Zamknięte" : "Otwarte"), stanTxt[1] || stanTxt[0], "cmsp-kafel--stan", st.stan) +
    kafel("promocje", "Aktywne promocje", prA, prZ ? "zaplanowane: " + prZ : "brak zaplanowanych") +
    kafel("aktualnosci", "Aktualności na stronie", akA, "wszystkich: " + S.aktualnosci.length) +
    kafel("uslugi", "Usługi", widoczne(S.uslugi).length, "w " + widoczne(S.kategorie).length + " kategoriach") +
    kafel("galeria", "Zdjęcia w galerii", widoczne(S.galeria).length, "ukryte: " + S.galeria.filter(function (x) { return x.ukryta; }).length) +
    kafel("opinie", "Opinie", widoczne(S.opinie).length, widoczne(S.opinie).length ? "średnia " + (widoczne(S.opinie).reduce(function (a, b) { return a + (+b.ocena || 5); }, 0) / widoczne(S.opinie).length).toFixed(1).replace(".", ",") : "dodaj prawdziwe opinie") +
    "</div>" +
    '<div class="cmsp-karta" style="margin-top:1rem"><h2>Harmonogram promocji i aktualności</h2><p class="cmsp-op">30 dni wstecz i 90 dni naprzód. Kliknij pasek, żeby edytować wpis.</p>' + htmlGantt() +
    '<div class="cmsp-legenda"><span><i style="background:#2F8F5B"></i>Aktywne</span><span><i style="background:#D9A21B"></i>Zaplanowane</span><span><i style="background:#A3A9B3"></i>Zakończone / wstrzymane</span><span><i style="background:#B3261E;width:2px;height:14px"></i>Dzisiaj</span></div></div>' +
    '<div class="cmsp-karta"><h2>Najbliższe 45 dni</h2>' + htmlTerminy() + "</div>";
}
function htmlGantt() {
  var D = dzisISO(), start = dodajDni(D, -30), koniec = dodajDni(D, 90), DNI_Z = 120;
  var wiersze = [];
  ["promocje", "aktualnosci"].forEach(function (kol) {
    widoczne(S[kol]).forEach(function (x) {
      var od = x.od || start, do_ = x.do || koniec;
      if (do_ < start || od > koniec) return;
      wiersze.push({ kol: kol, x: x, od: od, do: do_ });
    });
  });
  if (!wiersze.length) return '<div class="cmsp-pusto">Brak promocji i aktualności w tym okresie.</div>';
  wiersze.sort(function (a, b) { return a.od < b.od ? -1 : 1; });
  var W = 1000, L = 240, P = 12, G = 36, RH = 32, H = G + wiersze.length * RH + 8;
  var dzien = function (iso) { return Math.round((zISO(iso) - zISO(start)) / 864e5); };
  var X = function (n) { return L + n / DNI_Z * (W - L - P); };
  var s = '<svg viewBox="0 0 ' + W + " " + H + '" role="img" aria-label="Harmonogram: ' + wiersze.length + ' wpisów">';
  for (var i = 0; i <= DNI_Z; i++) {
    var d = dodajDni(start, i);
    if (d.slice(8) === "01") s += '<line x1="' + X(i) + '" y1="' + (G - 8) + '" x2="' + X(i) + '" y2="' + H + '" stroke="#E3E6EA"/><text x="' + (X(i) + 4) + '" y="' + (G - 14) + '" font-size="12" fill="#565C66">' + MIESIACE_K[+d.slice(5, 7) - 1] + "</text>";
  }
  wiersze.forEach(function (w, n) {
    var y = G + n * RH, st = statusCzasowy(w.x), kolor = st === "aktywna" ? "#2F8F5B" : st === "zaplanowana" ? "#D9A21B" : "#A3A9B3";
    var a = Math.max(0, dzien(w.od)), b = Math.min(DNI_Z, dzien(w.do) + 1);
    var t = w.x.tytul.length > 30 ? w.x.tytul.slice(0, 29) + "…" : w.x.tytul;
    s += '<g data-akcja="edytuj" data-kol="' + w.kol + '" data-id="' + w.x.id + '" style="cursor:pointer"><title>' + esc(w.x.tytul) + " · " + STATUS_NAZWY[st] + " · " + zakres(w.x) + "</title>" +
      '<rect x="0" y="' + y + '" width="' + W + '" height="' + RH + '" fill="' + (n % 2 ? "#FAFBFC" : "#FFFFFF") + '"/>' +
      '<text x="8" y="' + (y + 20) + '" font-size="13" fill="#15171C"><tspan fill="#8A909A" font-size="11">' + (w.kol === "promocje" ? "PROMO " : "INFO ") + "</tspan>" + esc(t) + "</text>" +
      '<rect x="' + X(a) + '" y="' + (y + 8) + '" width="' + Math.max(4, X(b) - X(a) - 2) + '" height="16" rx="4" fill="' + kolor + '"/>' +
      (!w.x.do ? '<path d="M' + (X(b) - 10) + " " + (y + 10) + "l8 6-8 6" + '" stroke="#fff" stroke-width="2" fill="none"/>' : "") + "</g>";
  });
  var xd = X(30);
  s += '<line x1="' + xd + '" y1="' + (G - 8) + '" x2="' + xd + '" y2="' + H + '" stroke="#B3261E" stroke-width="2"/><text x="' + (xd + 4) + '" y="12" font-size="12" font-weight="700" fill="#B3261E">dzisiaj</text></svg>';
  return '<div class="cmsp-gantt">' + s + "</div>";
}
function htmlTerminy() {
  var D = dzisISO(), K = dodajDni(D, 45), z = [];
  [["promocje", "Promocja"], ["aktualnosci", "Aktualność"]].forEach(function (p) {
    widoczne(S[p[0]]).forEach(function (x) {
      if (x.wstrzymana) return;
      if (x.od && x.od > D && x.od <= K) z.push({ d: x.od, plak: "zaplanowana", et: "Pojawi się", t: p[1] + ": " + x.tytul });
      if (x.do && x.do >= D && x.do <= K && (!x.od || x.od <= x.do)) z.push({ d: dodajDni(x.do, 1), plak: "zakonczona", et: "Zniknie", t: p[1] + ": " + x.tytul + " (ostatni dzień " + dataKrotko(x.do) + ")" });
    });
  });
  widoczne(S.dniSpecjalne).forEach(function (x) { if (x.data >= D && x.data <= K) z.push({ d: x.data, plak: "wstrzymana", et: "Godziny", t: (x.nieczynne ? "warsztat nieczynny" : "otwarte " + godz(x.od) + "–" + godz(x.do)) + (x.opis ? " (" + x.opis + ")" : "") }); });
  if (!z.length) return '<div class="cmsp-pusto">W najbliższych 45 dniach nic się nie zmienia.</div>';
  z.sort(function (a, b) { return a.d < b.d ? -1 : 1; });
  return '<ul class="cmsp-terminy">' + z.map(function (e) { return '<li><time datetime="' + e.d + '">' + dataKrotko(e.d) + "." + e.d.slice(2, 4) + '</time><span class="cmsp-plak cmsp-plak--' + e.plak + '">' + e.et + "</span><span>" + esc(e.t) + "</span></li>"; }).join("") + "</ul>";
}

/* ---------- start ---------- */
function start() {
  var k = document.getElementById("cms-klodka");
  k.addEventListener("click", function () { cmsWejdz(k); });
  odswiezKlodke();
  wczytajZapis().then(function (z) {
    if (z && z._app === APP_ID) S = scalStan(z);
    trasa(location.hash, false);
  });
}
if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start); else start();

</script>
